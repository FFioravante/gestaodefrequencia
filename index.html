        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @media print {
            @page { size: A4; margin: 0; }
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            /* O modal do formulário/relatório fica dentro de um "overlay" de tela cheia
               (fundo escuro, centralizado) que precisa desaparecer na impressão — mas sem
               levar o conteúdo junto! Antes esse overlay usava a classe .no-print, que o
               escondia por inteiro (display:none num elemento-pai esconde tudo dentro dele,
               mesmo que o filho tente forçar display:block) — por isso a impressão saía em
               branco. Agora o overlay tem sua própria classe e só perde o visual de "janela
               flutuante", continuando visível.
            */
            .print-overlay {
                position: static !important;
                inset: auto !important;
                background: none !important;
                backdrop-filter: none !important;
                padding: 0 !important;
                display: block !important;
                overflow: visible !important;
            }
            .printable-form {
                display: block !important;
                width: 21cm;
                height: 29.7cm;
                padding: 1.5cm;
                margin: 0;
                position: absolute;
                top: 0; left: 0;
                z-index: 1000;
                background: white !important;
                color: black !important;
            }
            /* Relatório de ranking: ao contrário do formulário de compensação (uma página
               fixa em A4), este pode ter várias seções e mais alunos do que cabem numa
               página só — então fica no fluxo normal (sem position:absolute) e deixa o
               navegador paginar automaticamente. */
            .printable-report {
                display: block !important;
                position: static !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                background: white !important;
                color: black !important;
            }
            table { border-collapse: collapse; width: 100%; }
            td, th { border: 1px solid black !important; padding: 4px; }
        }
    </style>

                // No relatório oficial, esse campo vem assim: "Unidade Curricular: PROAP - PROAP -
                // PROGRAMAÇÃO DO ABASTECIMENTO DA PRODUÇÃO 1° Período de: ...". Ou seja: o código
                // da disciplina aparece repetido duas vezes, seguido do nome completo, até a
                // informação de período. Tentamos primeiro pegar o nome completo (mais claro pra
                // reconhecer a disciplina); se o formato vier diferente do esperado, caímos para
                // pegar só o código curto — melhor mostrar algo do que nada.
                let disciplineName = null;
                const ucRegexFull = /Unidade Curricular:\s*(\S+)\s*-\s*\S+\s*-\s*(.*?)\s*\d+°\s*Per[ií]odo/i;
                const ucMatchFull = text.match(ucRegexFull);
                if (ucMatchFull) {
                    const ucCode = ucMatchFull[1].trim().toUpperCase();
                    const ucFullName = ucMatchFull[2].trim().replace(/\s+/g, ' ').toUpperCase();
                    disciplineName = ucFullName ? `${ucCode} — ${ucFullName}` : ucCode;
                } else {
                    const ucRegexSimple = /Unidade Curricular:\s*(.*?)\s*-/i;
                    const ucMatchSimple = text.match(ucRegexSimple);
                    disciplineName = ucMatchSimple ? ucMatchSimple[1].trim().toUpperCase() : null;
                }
                if (!disciplineName) {
                    warnings.push('Não foi possível identificar a Unidade Curricular (disciplina) no PDF.');
                    disciplineName = 'UC NÃO IDENTIFICADA';
                }

                const aulasDadasRegex = /AULAS\s+DADAS[\s\S]*?Turma\s+Toda:\s*(\d+)/i;
                const aulasDadasMatch = text.match(aulasDadasRegex);
                const currentHorasDadas = aulasDadasMatch ? parseInt(aulasDadasMatch[1], 10) : null;
                if (currentHorasDadas === null) {
                    warnings.push('Não foi possível identificar o total de "Aulas Dadas" (Turma Toda). O percentual desta turma/disciplina não será calculado até você conferir o PDF.');
                }

                const chpMatch = text.match(/Total CHP:\s*(\d+)/i);
                const currentCHP = chpMatch ? parseInt(chpMatch[1], 10) : null;
                if (currentCHP === null) {
                    warnings.push('Não foi possível identificar o "Total CHP" (carga horária prevista). O percentual desta turma/disciplina não será calculado até você conferir o PDF.');
                }

                const cursoRegex = /Curso:\s*(.*?)\s*\(/i;
                const cursoMatch = text.match(cursoRegex);
                const cursoName = cursoMatch ? cursoMatch[1].trim() : null;
                if (!cursoName) warnings.push('Não foi possível identificar o nome do Curso no PDF.');

                // Regex do docente: pega letras maiúsculas/espaços logo após "Docente:", com um
                // tamanho máximo razoável para um nome de pessoa. No relatório real, logo depois
                // do nome vem "Nº de Matrícula..." — o "º" já não faz parte do alfabeto aceito,
                // então a captura para sozinha ali; às vezes sobra uma letra solta (o "N" de "Nº"),
                // que é removida na limpeza abaixo.
                const docenteRegex = /Docente:\s*([A-ZÀ-Ÿ][A-ZÀ-Ÿ'\.\s]{2,58})/;
                const docenteMatch = text.match(docenteRegex);
                let docenteName = docenteMatch ? docenteMatch[1].trim().replace(/\s+/g, ' ') : null;
                if (docenteName) {
                    // remove uma eventual letra solta que "vazou" do campo seguinte (ex.: "...FIORAVANTE N")
                    docenteName = docenteName.replace(/\s+[A-ZÀ-Ÿ]$/, '').trim();
                    // Segunda camada de proteção: se mesmo assim o nome capturado tiver palavras
                    // demais ou conter termos que claramente pertencem a outro campo do relatório
                    // (e não a um nome de pessoa), descartamos e tratamos como "não identificado"
                    // em vez de arriscar mostrar um nome errado na ficha oficial.
                    const wordCount = docenteName.split(' ').filter(Boolean).length;
                    const looksLikeAnotherField = /\b(AULAS|DADAS|TOTAL|CURSO|TURMA|UNIDADE|CARGA|HOR[AÁ]RIO|ALUNO|MATR[IÍ]CULA|SITUA[CÇ][AÃ]O|CHP|PER[IÍ]ODO)\b/.test(docenteName);
                    if (wordCount > 6 || looksLikeAnotherField) docenteName = null;
                }
                if (!docenteName) warnings.push('Não foi possível identificar o nome do Docente no PDF.');

                // Corta fora o rodapé de cada página ("Observações: ASSINATURA DO DOCENTE:
                // DATA: dd/mm/aaaa ...") antes de procurar os alunos. Sem isso, a data do
                // rodapé (ex.: "03/09/2026") era lida como se fosse mais um número no bloco
                // do ÚLTIMO aluno da lista, e o "último número do bloco" (usado como total de
                // faltas) virava "2026" em vez do valor real — o bug mais grave que você viu.
                const obsIndex = text.search(/Observa[cç][õo]es:/i);
                const studentAreaText = obsIndex !== -1 ? text.slice(0, obsIndex) : text;

                const studentBlocks = studentAreaText.split(/(?=\b\d{8}\b)/g);
                const students = [];

                studentBlocks.forEach(block => {
                    const cleanBlock = block.replace(/\s+/g, ' ').trim();
                    const enrollmentMatch = cleanBlock.match(/^(\d{8})/);
                    if (!enrollmentMatch) return;

                    const enrollment = enrollmentMatch[1];
                    const allNumbers = cleanBlock.match(/\d+/g);
                    if (allNumbers && allNumbers.length >= 4) {
                        const absencesRaw = allNumbers[allNumbers.length - 1];
                        const absences = parseInt(absencesRaw, 10);
                        const namePart = cleanBlock.slice(8).match(/[A-ZÀ-Ÿ\s()\-]{3,}/);
                        const name = namePart ? namePart[0].trim() : "Nome não identificado";

                        // Checagem de sanidade: a leitura do número de faltas (heurística
                        // "último número do bloco de texto") pode ser enganada por um
                        // número extra no PDF. Quando o resultado parece implausível,
                        // o aluno é marcado como "uncertain" e a interface avisa o
                        // professor para conferir manualmente, em vez de confiar cegamente.
                        let uncertain = false;
                        if (isNaN(absences) || absences < 0) uncertain = true;
                        if (!namePart) uncertain = true;
                        if (currentCHP !== null && !isNaN(absences) && absences > currentCHP) uncertain = true;

                        if (enrollment !== "00000000") {
                            students.push({
                                id: enrollment,
                                name,
                                absences: isNaN(absences) ? 0 : absences,
                                className,
                                curso: cursoName || 'Não identificado',
                                docente: docenteName || 'Não identificado',
                                uncertain
                            });
                        }
                    }
                });

                if (students.length === 0) {
                    warnings.push('Nenhum aluno foi identificado neste PDF. Confira se o arquivo é realmente o relatório de frequência do SENAI.');
                }

                return {
                    key: `${disciplineName}-${className}`,
                    disciplineName,
                    className,
                    chp: currentCHP,
                    horasDadas: currentHorasDadas,
                    students,
                    warnings,
                    fileName: fileName || '',
                    importedAt: new Date().toISOString()
                };
            };

            const handleFileUpload = async (event) => {
                const files = Array.from(event.target.files);
                if (files.length === 0) return;
                setIsProcessing(true);

                try {
                    const pdfjsLib = window['pdfjs-dist/build/pdf'];
                    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

                    const newEntries = {};
                    const importWarnings = [];
                    for (const file of files) {
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        let fullText = "";
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            fullText += textContent.items.map(item => item.str).join(' ') + '\n';
                        }

                        // Um único PDF pode trazer várias disciplinas (uma por página, mesma
                        // turma). Cada página começa com "Curso: ..." — dividimos o texto ali,
                        // e processamos cada pedaço (seção) separadamente. Isso corrige a perda
                        // de disciplinas que existia quando o arquivo inteiro era tratado como
                        // uma coisa só.
                        const sections = fullText
                            .split(/(?=Curso:\s)/i)
                            .map(s => s.trim())
                            .filter(s => s.length > 0 && /Unidade Curricular:/i.test(s));

                        if (sections.length === 0) {
                            importWarnings.push({
                                file: file.name,
                                key: `arquivo-nao-reconhecido-${file.name}`,
                                label: 'Arquivo não reconhecido',
                                warnings: ['Não foi encontrada nenhuma seção de "Unidade Curricular" neste PDF. Confira se é realmente o relatório de Controle de Frequência do SENAI.']
                            });
                            continue;
                        }

                        sections.forEach(section => {
                            const extracted = parseSenaiSection(section, file.name);
                            const existing = newEntries[extracted.key];
                            if (existing) {
                                // Mesma disciplina + turma apareceu mais de uma vez dentro do MESMO
                                // arquivo — no relatório real isso acontece quando uma disciplina
                                // continua numa segunda página (mesmo cabeçalho repetido, só com
                                // outro trecho de datas). Nesses casos o total de faltas de cada
                                // aluno já vem repetido/igual em cada página, mas por segurança
                                // combinamos os alunos pegando o maior valor de faltas encontrado
                                // para cada um, em vez de simplesmente descartar a página anterior.
                                const mergedStudents = [...existing.students];
                                extracted.students.forEach(s => {
                                    const idx = mergedStudents.findIndex(m => m.id === s.id);
                                    if (idx === -1) mergedStudents.push(s);
                                    else if (s.absences > mergedStudents[idx].absences) mergedStudents[idx] = s;
                                });
                                newEntries[extracted.key] = { ...extracted, students: mergedStudents };
                            } else {
                                newEntries[extracted.key] = extracted;
                            }
                            if (extracted.warnings.length > 0) {
                                importWarnings.push({ file: file.name, key: extracted.key, label: `${extracted.disciplineName} — ${extracted.className}`, warnings: extracted.warnings });
                            }
                        });
                    }
                    setDataStore(prev => ({ ...prev, ...newEntries }));
                    setLastImportWarnings(importWarnings);
                } catch (e) {
                    alert("Erro ao ler PDF: " + e.message);
                } finally {
                    setIsProcessing(false);
                    event.target.value = null;
                }
            };

            const removeEntry = (key) => {
                setDataStore(prev => {
                    const next = { ...prev };
                    delete next[key];
                    return next;
                });
            };

            const clearAllData = () => {
                if (window.confirm('Limpar todos os dados importados? Esta ação não pode ser desfeita.')) {
                    setDataStore({});
                    setIgnoredIds(new Set());
                    setLastImportWarnings([]);
                }
            };

            // Cada linha aqui é uma combinação (aluno, disciplina) — não um aluno só. No modo
            // "Consolidado" isso significa que um aluno que está estourado em duas disciplinas
            // aparece em DUAS linhas, cada uma com o rótulo da própria disciplina e seu próprio
            // percentual (o limite de 25%/30% é sempre calculado por disciplina — nunca fazia
            // sentido somar a carga horária de disciplinas diferentes numa única conta). Isso
            // também faz a busca por nome trazer o aluno em todas as disciplinas de uma vez,
            // cada ocorrência mostrada separadamente.
            const processedData = useMemo(() => {
                const entries = Object.values(dataStore);
                if (entries.length === 0) return [];
                const filtered = entries.filter(e => (selectedTurma === 'Todas' || e.className === selectedTurma) && (selectedDiscipline === 'Consolidado' || e.disciplineName === selectedDiscipline));

                const rows = [];
                filtered.forEach(entry => {
                    const entryIncomplete = entry.chp === null || entry.horasDadas === null;
                    entry.students.forEach(s => {
                        if (ignoredIds.has(s.id)) return;
                        const rowKey = `${s.id}::${entry.key}`;
                        const base = { ...s, rowKey, discipline: entry.disciplineName, className: entry.className, totalCHP: entry.chp, horasDadas: entry.horasDadas, hasUncertainReading: s.uncertain };
                        if (entryIncomplete) {
                            // Se este relatório específico tinha CHP ou Aulas Dadas não
                            // identificados, NÃO calculamos percentual nenhum PARA ESSA
                            // DISCIPLINA — é exatamente esse "cálculo com número inventado" que
                            // causava faltas "estourando" sem motivo real. Mostramos "dados
                            // incompletos" em vez de um percentual (possivelmente) errado.
                            rows.push({ ...base, percentage: null, realPercentage: null, isCompensar: false, isPreventive: false, isIncomplete: true });
                            return;
                        }
                        const percentage = entry.chp > 0 ? (s.absences / entry.chp) * 100 : null;
                        const realPercentage = entry.horasDadas > 0 ? (s.absences / entry.horasDadas) * 100 : null;
                        const isCompensar = percentage !== null && percentage > 25;
                        const isPreventive = !isCompensar && realPercentage !== null && realPercentage >= 30;
                        rows.push({ ...base, percentage, realPercentage, isCompensar, isPreventive, isIncomplete: false });
                    });
                });
                return rows;
            }, [dataStore, selectedTurma, selectedDiscipline, ignoredIds]);

            // As medalhas do "Hall da Fama" agora são por LINHA (aluno+disciplina), não por
            // aluno — senão um aluno com poucas faltas numa disciplina "herdaria" a mesma
            // medalha numa disciplina diferente onde ele vai mal.
            const rankings = useMemo(() => {
                const withPercentage = processedData.filter(s => !s.isIncomplete);
                if (withPercentage.length === 0) return {};
                const uniqueAbsences = [...new Set(withPercentage.map(s => s.absences))].sort((a, b) => a - b);
                const map = {};
                withPercentage.forEach(s => {
                    const rank = uniqueAbsences.indexOf(s.absences);
                    if (rank === 0) map[s.rowKey] = "🥇";
                    else if (rank === 1) map[s.rowKey] = "🥈";
                    else if (rank === 2) map[s.rowKey] = "🥉";
                });
                return map;
            }, [processedData]);

            const stats = useMemo(() => {
                if (processedData.length === 0) return null;
                const withPercentage = processedData.filter(s => !s.isIncomplete);
                // "Alunos Ativos" é uma contagem de PESSOAS (RA único), não de linhas —
                // diferente de critical/atRisk/incomplete, que contam ocorrências por
                // disciplina de propósito (é o que faz um aluno estourado em duas
                // disciplinas aparecer duas vezes ali). Aqui não: um aluno matriculado em
                // 3 disciplinas continua sendo 1 aluno só neste número absoluto.
                const uniqueStudentCount = new Set(processedData.map(s => s.id)).size;
                return {
                    total: uniqueStudentCount,
                    critical: processedData.filter(s => s.isCompensar).length,
                    atRisk: processedData.filter(s => s.isPreventive).length,
                    incomplete: processedData.filter(s => s.isIncomplete).length,
                    avg: withPercentage.length > 0 ? (withPercentage.reduce((acc, s) => acc + (100 - s.percentage), 0) / withPercentage.length).toFixed(1) : '—'
                };
            }, [processedData]);

            const availableTurmas = useMemo(() => ['Todas', ...new Set(Object.values(dataStore).map(e => e.className))].sort(), [dataStore]);
            // A lista de disciplinas do combobox agora respeita a turma selecionada — antes
            // mostrava as disciplinas de TODAS as turmas juntas, então ao escolher uma turma
            // específica apareciam UCs de outros cursos que nem existem ali.
            const availableDisciplines = useMemo(() => {
                const relevantEntries = Object.values(dataStore).filter(e => selectedTurma === 'Todas' || e.className === selectedTurma);
                return ['Consolidado', ...new Set(relevantEntries.map(e => e.disciplineName))].sort();
            }, [dataStore, selectedTurma]);

            // Se a turma mudar e a disciplina escolhida não existir mais nessa turma, volta
            // para "Consolidado" em vez de deixar o filtro "travado" numa combinação inválida
            // (o que fazia a tabela aparecer vazia sem explicação).
            useEffect(() => {
                if (!availableDisciplines.includes(selectedDiscipline)) {
                    setSelectedDiscipline('Consolidado');
                }
            }, [availableDisciplines]);

            // A cada coluna clicável (Estudante / Faltas / Comparação de Impacto) corresponde
            // uma chave de ordenação. Ordenar por "name" agrupa naturalmente as linhas de um
            // mesmo aluno que aparece em várias disciplinas, já que elas ficam lado a lado em
            // ordem alfabética (usamos a disciplina como critério de desempate, então a ordem
            // entre as linhas do mesmo aluno fica sempre estável).
            const compareByKey = (key) => (a, b) => {
                switch (key) {
                    case 'name':
                        return a.name.localeCompare(b.name, 'pt-BR') || (a.discipline || '').localeCompare(b.discipline || '', 'pt-BR');
                    case 'absences':
                        return (a.absences - b.absences) || a.name.localeCompare(b.name, 'pt-BR');
                    case 'impact':
                    default:
                        return ((a.realPercentage ?? -1) - (b.realPercentage ?? -1)) || a.name.localeCompare(b.name, 'pt-BR');
                }
            };

            const filteredAndSorted = useMemo(() => {
                let res = processedData.filter(s => {
                    const matchesSearch = s.name.toLowerCase().includes(searchTerm.toLowerCase());
                    if (statusFilter === 'top') return matchesSearch && !!rankings[s.rowKey];
                    if (statusFilter === 'preventive') return matchesSearch && s.isPreventive;
                    if (statusFilter === 'danger') return matchesSearch && s.isCompensar;
                    if (statusFilter === 'incomplete') return matchesSearch && s.isIncomplete;
                    return matchesSearch;
                });
                const dir = sortConfig.direction === 'asc' ? 1 : -1;
                res.sort((a, b) => compareByKey(sortConfig.key)(a, b) * dir);
                return res;
            }, [processedData, searchTerm, statusFilter, rankings, sortConfig]);

            // Ordenação padrão de cada filtro do painel, aplicada no momento em que o
            // professor clica no card. "Ação Preventiva" e "Compensação" pedem ordem
            // alfabética (o que já agrupa as disciplinas de um mesmo aluno); "Hall da Fama"
            // mantém o critério antigo (menos faltas primeiro); os demais mantêm o
            // comportamento de antes (maior comprometimento primeiro).
            const defaultSortForFilter = (filter) => {
                if (filter === 'top') return { key: 'absences', direction: 'asc' };
                if (filter === 'preventive' || filter === 'danger' || filter === 'incomplete') return { key: 'name', direction: 'asc' };
                return { key: 'impact', direction: 'desc' };
            };
            const applyStatusFilter = (filter) => {
                setStatusFilter(filter);
                setSortConfig(defaultSortForFilter(filter));
            };
            // Clique num cabeçalho de coluna: se já é a coluna ativa, inverte a direção;
            // senão troca de coluna com uma direção inicial que costuma fazer mais sentido
            // (nome em ordem alfabética, números do maior para o menor).
            const handleSort = (key) => {
                setSortConfig(prev => {
                    if (prev.key === key) return { key, direction: prev.direction === 'asc' ? 'desc' : 'asc' };
                    return { key, direction: key === 'name' ? 'asc' : 'desc' };
                });
            };
            const sortArrow = (key) => {
                if (sortConfig.key !== key) return <span className="text-slate-300 ml-1 normal-case">↕</span>;
                return <span className="ml-1 text-indigo-500 normal-case">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>;
            };

            const entriesWithIssues = useMemo(() => Object.values(dataStore).filter(e => e.warnings && e.warnings.length > 0), [dataStore]);

            const situacaoLabel = (s) => {
                if (s.isIncomplete) return 'Dados incompletos';
                if (s.isCompensar) return 'Compensar';
                if (s.isPreventive) return 'Ação preventiva';
                return 'Regular';
            };

            // Exporta a lista atualmente filtrada (respeita turma, disciplina, busca e o
            // cartão selecionado) como CSV — pra mandar pra coordenação ou áreas que
            // precisam agir, sem precisar copiar tabela na mão. Usa ";" como separador e um
            // BOM no início porque é o que o Excel em português espera pra abrir certo
            // (com "," ele quebra números e acentuação).
            const exportCSV = () => {
                const escapeCSV = (value) => {
                    const str = String(value ?? '');
                    return /[",;\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
                };
                const headers = ['Nome', 'RA', 'Turma', 'Disciplina', 'Faltas (h)', '% Limite Total (máx. 25%)', '% Comprometimento Atual (máx. 30%)', 'Situação'];
                const rows = filteredAndSorted.map(s => [
                    s.name,
                    s.id,
                    s.className,
                    s.discipline,
                    s.absences,
                    s.percentage !== null ? s.percentage.toFixed(1).replace('.', ',') : 'N/D',
                    s.realPercentage !== null ? s.realPercentage.toFixed(1).replace('.', ',') : 'N/D',
                    situacaoLabel(s)
                ]);
                const csvContent = '﻿' + [headers, ...rows].map(row => row.map(escapeCSV).join(';')).join('\r\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                const turmaPart = selectedTurma === 'Todas' ? 'todas-turmas' : selectedTurma.replace(/\s+/g, '-');
                const dateStr = new Date().toISOString().slice(0, 10);
                link.href = url;
                link.download = `frequencia_${turmaPart}_${dateStr}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            // Gera o "Aviso de Baixa Frequência" (ficha 790-FR-45) preenchido para o aluno em
            // Ação Preventiva, a partir do PDF modelo oficial embutido no app. Em vez de montar
            // um layout próprio (como faz o formulário de Compensação), aqui usamos a pdf-lib
            // para criar campos de formulário reais sobre o PDF do modelo e preenchê-los — o
            // resultado é um PDF idêntico ao que seria preenchido à mão, nos mesmos campos.
            //
            // Posições dos campos (em pontos, origem no canto inferior esquerdo) foram medidas
            // diretamente no modelo oficial (formulário 790-FR-45 V.1, página 1, A4 595x842pt).
            const AVISO_PREVENTIVO_FIELDS = {
                aluno:      [85, 710, 322, 724],
                ra:         [345, 710, 400, 724],
                turma:      [439, 710, 535, 724],
                disciplina: [100, 693, 322, 707],
                data:       [354, 658, 535, 672],
                frequencia: [123, 614, 173, 628],
                aulasDadas: [235, 614, 320, 628],
                faltas:     [359, 614, 535, 628],
            };

            const gerarAvisoPreventivoPDF = async (student) => {
                try {
                    const { PDFDocument, StandardFonts } = PDFLib;
                    const pdfBytes = Uint8Array.from(atob(AVISO_PREVENTIVO_PDF_BASE64), c => c.charCodeAt(0));
                    const pdfDoc = await PDFDocument.load(pdfBytes);
                    const form = pdfDoc.getForm();
                    const page = pdfDoc.getPages()[0];
                    const font = await pdfDoc.embedFont(StandardFonts.Helvetica);

                    // O nome da disciplina no app vem como "CÓDIGO — Nome completo" (ex.:
                    // "SUSPP — SUSTENTABILIDADE..."); no formulário oficial só entra o nome.
                    const disciplinaCompleta = (student.discipline || '').split('—').pop().trim();
                    const frequenciaPct = student.realPercentage !== null && student.realPercentage !== undefined
                        ? Math.max(0, Math.round(100 - student.realPercentage))
                        : null;
                    const hoje = new Date();
                    const dataFormatada = String(hoje.getDate()).padStart(2, '0') + '/' + String(hoje.getMonth() + 1).padStart(2, '0') + '/' + hoje.getFullYear();

                    const valores = {
                        aluno: student.name || '',
                        ra: student.id || '',
                        turma: student.className || '',
                        disciplina: disciplinaCompleta,
                        data: dataFormatada,
                        frequencia: frequenciaPct !== null ? `${frequenciaPct}%` : '',
                        aulasDadas: student.horasDadas !== null && student.horasDadas !== undefined ? String(student.horasDadas) : '',
                        faltas: student.absences !== null && student.absences !== undefined ? String(student.absences) : '',
                    };

                    // Reduz o tamanho da fonte até o texto caber na largura do campo, para
                    // nomes/disciplinas longos não serem cortados (problema que existia na
                    // versão preenchida manualmente pelo professor).
                    const fitFontSize = (text, maxWidth, maxSize = 10, minSize = 6) => {
                        let size = maxSize;
                        while (size > minSize && font.widthOfTextAtSize(text, size) > maxWidth) size -= 0.5;
                        return size;
                    };

                    Object.entries(AVISO_PREVENTIVO_FIELDS).forEach(([key, [x0, y0, x1, y1]]) => {
                        const value = valores[key] || '';
                        const field = form.createTextField(`aviso_preventivo_${key}_${student.rowKey || student.id}`);
                        field.addToPage(page, { x: x0, y: y0, width: x1 - x0, height: y1 - y0, font, borderWidth: 0 });
                        field.setFontSize(fitFontSize(value, (x1 - x0) - 4));
                        field.setText(value);
                    });

                    const outBytes = await pdfDoc.save();
                    const blob = new Blob([outBytes], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    const nomeArquivo = (student.name || 'aluno').replace(/\s+/g, '_');
                    link.href = url;
                    link.download = `Aviso_Baixa_Frequencia_${nomeArquivo}.pdf`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                } catch (e) {
                    alert('Erro ao gerar o PDF de Ação Preventiva: ' + e.message);
                }
            };

            // Dados do "Ranking para Compartilhar". Diferente da tabela principal, aqui
            // SEMPRE olhamos todas as disciplinas do aluno dentro da turma selecionada —
            // ignoramos o filtro de disciplina do topo, porque "zero faltas" e "ação
            // preventiva" só fazem sentido avaliando o conjunto completo: um aluno só entra
            // no ranking de frequência exemplar se estiver com zero faltas em TODAS as
            // disciplinas que cursa, não só na que está selecionada no momento.
            const rankingReportData = useMemo(() => {
                const entries = Object.values(dataStore).filter(e => selectedTurma === 'Todas' || e.className === selectedTurma);
                const byStudent = {};
                entries.forEach(entry => {
                    const entryIncomplete = entry.chp === null || entry.horasDadas === null;
                    entry.students.forEach(s => {
                        if (ignoredIds.has(s.id)) return;
                        if (!byStudent[s.id]) byStudent[s.id] = { id: s.id, name: s.name, className: entry.className, rows: [] };
                        if (entryIncomplete) {
                            byStudent[s.id].rows.push({ discipline: entry.disciplineName, totalCHP: entry.chp, horasDadas: entry.horasDadas, absences: s.absences, percentage: null, realPercentage: null, isIncomplete: true, isPreventive: false });
                            return;
                        }
                        const percentage = entry.chp > 0 ? (s.absences / entry.chp) * 100 : null;
                        const realPercentage = entry.horasDadas > 0 ? (s.absences / entry.horasDadas) * 100 : null;
                        const isCompensar = percentage !== null && percentage > 25;
                        const isPreventive = !isCompensar && realPercentage !== null && realPercentage >= 30;
                        byStudent[s.id].rows.push({ discipline: entry.disciplineName, totalCHP: entry.chp, horasDadas: entry.horasDadas, absences: s.absences, percentage, realPercentage, isIncomplete: false, isPreventive });
                    });
                });
                const students = Object.values(byStudent);
                // Frequência exemplar: zero faltas em TODAS as disciplinas (nenhuma com dado
                // incompleto, senão não dá pra garantir o zero).
                const perfect = students
                    .filter(st => st.rows.length > 0 && st.rows.every(r => !r.isIncomplete && r.absences === 0))
                    .sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
                // Ação preventiva: mostramos só as disciplinas em que o aluno está de fato
                // nessa situação (ele pode ir bem em uma matéria e mal em outra).
                const preventive = students
                    .map(st => ({ ...st, rows: st.rows.filter(r => r.isPreventive) }))
                    .filter(st => st.rows.length > 0)
                    .sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
                return { perfect, preventive };
            }, [dataStore, selectedTurma, ignoredIds]);

            // Gera uma imagem PNG do relatório de ranking pra facilitar o compartilhamento
            // no WhatsApp (uma imagem abre em pré-visualização direto na conversa, ao
            // contrário de um PDF). Os botões da própria janela (marcados "no-print") são
            // ignorados na captura, senão apareceriam dentro da imagem final.
            const downloadReportImage = async () => {
                const el = document.getElementById('ranking-report-content');
                if (!el || typeof html2canvas === 'undefined') return;
                const canvas = await html2canvas(el, {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    useCORS: true,
                    ignoreElements: (element) => element.classList && element.classList.contains('no-print'),
                });
                const link = document.createElement('a');
                const turmaPart = selectedTurma === 'Todas' ? 'todas-turmas' : selectedTurma.replace(/\s+/g, '-');
                const dateStr = new Date().toISOString().slice(0, 10);
                link.download = `ranking_frequencia_${turmaPart}_${dateStr}.png`;
                link.href = canvas.toDataURL('image/png');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // Cor progressiva de risco: verde (tranquilo) → amarelo (atenção) → laranja
            // (alerta) → vermelho (crítico, já passou do limite). O "ratio" é o quanto do
            // limite já foi consumido — não é a mesma coisa que o percentual em si, porque
            // cada barra tem seu próprio limite (25% ou 30%).
            const riskStyle = (value, threshold) => {
                if (value === null || value === undefined) return { bar: 'bg-slate-300', text: 'text-slate-400', chip: 'bg-slate-100' };
                const ratio = value / threshold;
                if (ratio < 0.5) return { bar: 'bg-emerald-500', text: 'text-emerald-700', chip: 'bg-emerald-100' };
                if (ratio < 0.8) return { bar: 'bg-yellow-400', text: 'text-yellow-700', chip: 'bg-yellow-100' };
                if (ratio < 1.0) return { bar: 'bg-orange-500', text: 'text-orange-700', chip: 'bg-orange-100' };
                return { bar: 'bg-red-600', text: 'text-red-700', chip: 'bg-red-100' };
            };

            // Barra de impacto reutilizável: mostra o percentual DENTRO da barra, uma marca
            // vertical no valor de referência (o limite), e a cor muda progressivamente
            // conforme o risco (em vez de só indigo/laranja fixos como antes).
            const ImpactBar = ({ label, value, threshold, thresholdLabel }) => {
                const c = riskStyle(value, threshold);
                if (value === null) {
                    return (
                        <div className="space-y-2">
                            <div className="flex justify-between text-[13px] font-black text-slate-400 uppercase tracking-widest"><span>{label}</span><span>N/D</span></div>
                            <div className="h-7 bg-slate-100 rounded-full border border-slate-200"></div>
                        </div>
                    );
                }
                const scaleMax = threshold * 1.6;
                const fillPct = Math.min((value / scaleMax) * 100, 100);
                const markerPct = Math.min((threshold / scaleMax) * 100, 100);
                const showLabelInside = fillPct > 16;
                return (
                    <div className="space-y-2">
                        <div className={`flex justify-between text-[13px] font-black uppercase tracking-widest ${c.text}`}>
                            <span>{label}</span>
                            <span className={`${c.chip} px-2 rounded-lg`}>{thresholdLabel}</span>
                        </div>
                        <div className="relative h-7 bg-slate-100 rounded-full overflow-hidden border border-slate-200">
                            <div className={`h-full ${c.bar} transition-all duration-700 flex items-center justify-end pr-2`} style={{ width: `${fillPct}%` }}>
                                {showLabelInside && <span className="text-[10px] font-black text-white drop-shadow whitespace-nowrap">{value.toFixed(1)}%</span>}
                            </div>
                            {!showLabelInside && <span className="absolute inset-y-0 left-2 flex items-center text-[10px] font-black text-slate-500">{value.toFixed(1)}%</span>}
                            <div className="absolute top-0 bottom-0 w-0.5 bg-slate-600/50" style={{ left: `${markerPct}%` }} title={`Limite de referência: ${thresholdLabel}`}></div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900">
                    <header className="bg-white border-b border-slate-200 p-6 sticky top-0 z-50 no-print shadow-sm">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
                            <div className="flex items-center gap-6">
                                <div className="bg-white p-1 rounded-2xl w-20 h-20 overflow-hidden shadow-md border border-slate-100 flex items-center justify-center">
                                    {!logoFailed ? (
                                        <img src={LOGO_DATA_URI} className="w-full h-full object-contain" onError={() => setLogoFailed(true)} />
                                    ) : (
                                        <span className="text-indigo-600 font-black text-xl">SENAI</span>
                                    )}
                                </div>
                                <div><h1 className="text-2xl font-black text-slate-800 tracking-tight">Gestão de Frequência</h1><p className="text-[11px] uppercase font-bold text-slate-500 tracking-[0.2em]">CT 7.90 • Prof. Fábio Fioravante</p></div>
                            </div>
                            <div className="flex gap-3 flex-wrap justify-center">
                                <select value={selectedTurma} onChange={e => setSelectedTurma(e.target.value)} className="bg-indigo-50 border-none rounded-xl text-xs font-black uppercase p-2.5 text-indigo-700 shadow-sm outline-none focus:ring-2 focus:ring-indigo-500">{availableTurmas.map(t => <option key={t} value={t}>{t === 'Todas' ? 'Todas as Turmas' : `Turma: ${t}`}</option>)}</select>
                                <select value={selectedDiscipline} onChange={e => setSelectedDiscipline(e.target.value)} className="bg-indigo-50 border-none rounded-xl text-xs font-black uppercase p-2.5 text-indigo-700 shadow-sm outline-none focus:ring-2 focus:ring-indigo-500">{availableDisciplines.map(d => <option key={d} value={d}>{d === 'Consolidado' ? 'Consolidado (todas UCs)' : d}</option>)}</select>
                                <button onClick={() => setIsManageModalOpen(true)} className="relative bg-white border border-slate-200 p-2.5 rounded-xl text-slate-600 hover:bg-slate-50 shadow-sm">
                                    <Icons.Settings />
                                    {entriesWithIssues.length > 0 && <span className="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-white"></span>}
                                </button>
                                <label className="bg-indigo-600 px-6 py-2.5 rounded-xl text-xs font-black text-white uppercase cursor-pointer hover:bg-indigo-700 shadow-lg flex gap-2 items-center active:scale-95 transition-all"><Icons.Upload /> {isProcessing ? 'A Processar...' : 'Importar PDF'}<input type="file" className="hidden" accept=".pdf" onChange={handleFileUpload} multiple /></label>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto p-6 space-y-8 no-print pb-20">
                        {lastImportWarnings.length > 0 && (
                            <div className="bg-amber-50 border-2 border-amber-300 rounded-3xl p-6 space-y-3">
                                <div className="flex justify-between items-start gap-4">
                                    <div className="flex gap-3 items-start">
                                        <span className="text-amber-500 mt-0.5"><Icons.Alert /></span>
                                        <div>
                                            <p className="font-black text-amber-800 text-sm uppercase tracking-wide">Atenção: alguns PDFs importados agora têm dados que não foram totalmente reconhecidos</p>
                                            <p className="text-amber-700 text-xs mt-1">Para esses casos, o percentual de faltas NÃO foi calculado (para evitar mostrar um número errado). Confira o PDF original ou o formato do relatório.</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setLastImportWarnings([])} className="text-amber-400 hover:text-amber-600 shrink-0"><Icons.X /></button>
                                </div>
                                <div className="space-y-2">
                                    {lastImportWarnings.map((w, i) => (
                                        <div key={i} className="bg-white/70 rounded-2xl p-4 text-xs">
                                            <p className="font-black text-slate-700">{w.file} <span className="text-slate-400 font-bold">({w.label})</span></p>
                                            <ul className="list-disc list-inside text-amber-700 mt-1 space-y-0.5">
                                                {w.warnings.map((msg, j) => <li key={j}>{msg}</li>)}
                                            </ul>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {stats && (
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-5">
                                <button onClick={() => applyStatusFilter('all')} className={`text-left bg-white p-6 rounded-[2rem] border transition-all ${statusFilter === 'all' ? 'ring-2 ring-indigo-500 shadow-xl' : 'border-slate-100 shadow-sm'}`}><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Alunos Ativos</p><div className="text-4xl font-black text-slate-800">{stats.total}</div></button>
                                <button onClick={() => applyStatusFilter('top')} className={`text-left bg-white p-6 rounded-[2rem] border border-b-8 border-b-emerald-400 transition-all ${statusFilter === 'top' ? 'ring-2 ring-emerald-500 shadow-xl' : 'border-slate-100 shadow-sm'}`}><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Hall da Fama</p><div className="text-4xl font-black text-emerald-500">{stats.avg}{stats.avg !== '—' ? '%' : ''}</div></button>
                                <button onClick={() => applyStatusFilter('preventive')} className={`text-left bg-white p-6 rounded-[2rem] border border-l-8 border-l-blue-400 transition-all ${statusFilter === 'preventive' ? 'ring-2 ring-blue-500 shadow-xl' : 'border-slate-100 shadow-sm'}`}><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Ação Preventiva (≥30%)</p><div className="text-4xl font-black text-blue-500">{stats.atRisk}</div></button>
                                <button onClick={() => applyStatusFilter('danger')} className={`text-left bg-white p-6 rounded-[2rem] border border-l-8 border-l-red-500 transition-all ${statusFilter === 'danger' ? 'ring-2 ring-red-500 shadow-xl' : 'border-slate-100 shadow-sm'}`}><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Compensação (&gt;25%)</p><div className="text-4xl font-black text-red-500">{stats.critical}</div></button>
                            </div>
                        )}

                        {stats && stats.incomplete > 0 && (
                            <button onClick={() => applyStatusFilter('incomplete')} className={`w-full text-left bg-white p-5 rounded-[2rem] border-2 border-dashed transition-all flex items-center justify-between ${statusFilter === 'incomplete' ? 'ring-2 ring-amber-500 border-amber-400' : 'border-amber-200'}`}>
                                <div className="flex items-center gap-3"><span className="text-amber-500"><Icons.Alert /></span><span className="text-sm font-black text-amber-700 uppercase tracking-wide">{stats.incomplete} aluno(s) com dados incompletos — percentual não calculado</span></div>
                                <span className="text-[10px] font-black text-amber-500 uppercase">Ver lista</span>
                            </button>
                        )}

                        <div className="bg-white rounded-[3rem] border border-slate-100 overflow-hidden shadow-2xl shadow-slate-200/50">
                            <div className="p-8 border-b border-slate-50 flex items-center gap-4 justify-between"><div className="relative flex-1"><span className="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"><Icons.Search /></span><input type="text" placeholder="Filtrar por nome ou RA..." className="w-full bg-slate-50 border-none rounded-2xl py-4 pl-14 pr-6 text-slate-700 font-bold outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner" onChange={e => setSearchTerm(e.target.value)} /></div>
                                <button onClick={() => setShowRankingReport(true)} title="Gerar um ranking visual (zero faltas + ação preventiva) para compartilhar com a turma, ex.: no WhatsApp" className="shrink-0 bg-gradient-to-r from-indigo-600 to-purple-600 px-5 py-4 rounded-2xl text-xs font-black text-white uppercase flex gap-2 items-center hover:from-indigo-700 hover:to-purple-700 shadow-lg active:scale-95 transition-all">🏆 Ranking p/ Compartilhar</button>
                                {filteredAndSorted.length > 0 && (
                                    <button onClick={exportCSV} title="Exportar a lista atual (com os filtros aplicados) como CSV para enviar à coordenação" className="shrink-0 bg-emerald-600 px-5 py-4 rounded-2xl text-xs font-black text-white uppercase flex gap-2 items-center hover:bg-emerald-700 shadow-lg active:scale-95 transition-all"><Icons.Download /> Exportar CSV</button>
                                )}
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead><tr className="text-[11px] font-black uppercase text-slate-400 tracking-[0.25em] bg-slate-50/50 border-b border-slate-100">
                                        <th className="p-10 cursor-pointer select-none hover:text-slate-600 transition-colors" onClick={() => handleSort('name')} title="Ordenar por nome do aluno">Estudante{sortArrow('name')}</th>
                                        <th className="p-10 text-center cursor-pointer select-none hover:text-slate-600 transition-colors" onClick={() => handleSort('absences')} title="Ordenar por horas de falta">Faltas{sortArrow('absences')}</th>
                                        <th className="p-10 w-[500px] text-center cursor-pointer select-none hover:text-slate-600 transition-colors" onClick={() => handleSort('impact')} title="Ordenar por comprometimento atual (%)"><Icons.Chart /> Comparação de Impacto{sortArrow('impact')}</th>
                                        <th className="p-10 text-right">Ação</th>
                                    </tr></thead>
                                    <tbody className="divide-y divide-slate-50">
                                        {filteredAndSorted.length === 0 && (
                                            <tr><td colSpan="4" className="p-10 text-center text-slate-400 font-bold text-sm">Nenhum aluno encontrado. Importe um PDF ou ajuste os filtros.</td></tr>
                                        )}
                                        {filteredAndSorted.map(s => {
                                            const toComp = (!s.isIncomplete && s.isCompensar) ? Math.ceil(s.absences - (s.totalCHP * 0.25)) : null;
                                            return (
                                                <tr key={s.rowKey} className={`hover:bg-slate-50/80 transition-all ${rankings[s.rowKey] ? 'bg-emerald-50/20' : ''}`}>
                                                    <td className="p-10"><div><div className="flex items-center gap-3">{rankings[s.rowKey] && <span className="text-3xl">{rankings[s.rowKey]}</span>}<div className="font-black text-slate-700 text-lg">{s.name}</div></div><div className="text-[10px] font-bold text-slate-400 uppercase mt-1">RA: {s.id} • {s.className}</div><div className="inline-block mt-2 px-3 py-1 rounded-lg bg-indigo-50 text-indigo-600 text-[10px] font-black uppercase tracking-wide">{s.discipline || 'Disciplina não identificada'}</div></div></td>
                                                    <td className="p-10 text-center">
                                                        <div className="text-3xl font-black text-slate-800">{s.absences}h</div>
                                                        {s.hasUncertainReading && <div title="A leitura desse número no PDF pode estar errada — confira o arquivo original." className="text-[9px] font-black text-amber-600 uppercase mt-1 flex items-center justify-center gap-1"><Icons.Alert /> Conferir</div>}
                                                    </td>
                                                    <td className="p-10">
                                                        {s.isIncomplete ? (
                                                            <div className="bg-amber-50 border border-amber-200 rounded-2xl p-5 text-center text-amber-700 text-xs font-bold">⚠️ Dados incompletos neste relatório ({s.discipline || 'disciplina não identificada'}) — percentual não calculado. Confira o PDF e reimporte se necessário.</div>
                                                        ) : (
                                                        <div className="space-y-6">
                                                            <ImpactBar label={`Limite Total na Disciplina (${s.totalCHP}h)`} value={s.percentage} threshold={25} thresholdLabel="máx. 25%" />
                                                            <ImpactBar label={`Comprometimento Atual (${s.horasDadas}h dadas)`} value={s.realPercentage} threshold={30} thresholdLabel="alerta 30%" />
                                                        </div>
                                                        )}
                                                    </td>
                                                    <td className="p-10 text-right"><div className="relative group/btn inline-block">
                                                        {s.isIncomplete ? (
                                                            <span className="px-6 py-3 rounded-2xl font-black text-[11px] uppercase shadow-none whitespace-nowrap bg-amber-100 text-amber-700">Verificar PDF</span>
                                                        ) : (
                                                        <button onClick={() => { if (s.isCompensar) setActiveForm(s); else if (s.isPreventive) gerarAvisoPreventivoPDF(s); }} className={`px-6 py-3 rounded-2xl font-black text-[11px] uppercase shadow-lg transition-all whitespace-nowrap active:scale-95 ${s.isCompensar ? 'bg-red-600 text-white hover:bg-red-700' : s.isPreventive ? 'bg-blue-600 text-white shadow-blue-200 hover:bg-blue-700' : 'bg-emerald-100 text-emerald-700 shadow-none'}`}>{s.isCompensar ? 'Compensar' : s.isPreventive ? 'Ação Preventiva' : 'Regular'}{(s.isCompensar || s.isPreventive) && <Icons.Download />}</button>
                                                        )}
                                                        {s.isCompensar && <div className="absolute bottom-full right-0 mb-3 px-4 py-2 bg-slate-900 text-white text-[10px] font-black rounded-xl opacity-0 group-hover/btn:opacity-100 transition-opacity whitespace-nowrap shadow-2xl z-[60]">⚠️ Compensar {toComp}h para atingir 75%<div className="absolute top-full right-4 border-[6px] border-transparent border-t-slate-900"></div></div>}
                                                        {s.isPreventive && <div className="absolute bottom-full right-0 mb-3 px-4 py-2 bg-blue-700 text-white text-[10px] font-black rounded-xl opacity-0 group-hover/btn:opacity-100 transition-opacity whitespace-nowrap shadow-2xl z-[60]">📢 Alerta! Faltou {s.realPercentage.toFixed(1)}% do dado até aqui.<div className="absolute top-full right-4 border-[6px] border-transparent border-t-blue-700"></div></div>}
                                                    </div></td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>

                    {activeForm && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-sm z-[70] flex items-start justify-center p-4 py-10 overflow-y-auto print-overlay">
                            <div className="bg-white w-full max-w-[21cm] shadow-2xl relative printable-form p-12 text-black leading-tight">
                                <div className="absolute top-6 right-6 flex gap-2 no-print"><button onClick={() => window.print()} className="bg-indigo-600 text-white p-3 rounded-xl hover:bg-indigo-700 shadow-lg flex items-center gap-2 font-bold text-xs uppercase"><Icons.Printer /> Imprimir / PDF</button><button onClick={() => setActiveForm(null)} className="bg-slate-100 p-3 rounded-xl hover:bg-slate-200 text-slate-400"><Icons.X /></button></div>
                                <div className="text-right text-[10px] font-bold mb-2">Lista Mestra - Coordenação Pedagógica</div>
                                <table className="w-full border-collapse border border-black mb-8 text-center">
                                    <tr><td rowSpan="3" className="w-[18%] p-3 border border-black">{!logoFailed && <img src={LOGO_DATA_URI} className="h-10 mx-auto" />}</td><td className="font-bold text-sm uppercase py-2 border border-black bg-slate-50">CT 7.90 - CENTRO DE TREINAMENTO SENAI “EDWARD SÁVIO”</td><td className="w-[12%] border border-black text-[8px] font-bold">CT 7.90</td><td className="w-[12%] border border-black text-[8px] font-bold">FR-44</td></tr>
                                    <tr><td rowSpan="2" className="font-bold border border-black text-[12px]">Registro de Compensação de Ausência</td><td className="border border-black text-[9px] font-bold">Aprovação</td><td className="border border-black text-[9px] font-bold">Data</td></tr>
                                    <tr><td className="border border-black text-[8px]">Coord. Pedagógico</td><td className="border border-black text-[8px]">03/12/2024</td></tr>
                                </table>
                                <div className="border border-black text-[13px]"><div className="flex border-b border-black"><div className="w-2/3 p-3 border-r border-black"><b className="text-[10px] uppercase text-slate-500 block mb-1">Aluno:</b> {activeForm.name}</div><div className="w-1/3 p-3"><b className="text-[10px] uppercase text-slate-500 block mb-1">Turma:</b> {activeForm.className}</div></div><div className="flex border-b border-black"><div className="w-2/3 p-3 border-r border-black"><b className="text-[10px] uppercase text-slate-500 block mb-1">Componente(s) Curricular(es):</b> {activeForm.discipline}</div><div className="w-1/3 p-3"><b className="text-[10px] uppercase text-slate-500 block mb-1">Curso:</b> {activeForm.curso}</div></div><div className="p-3"><b className="text-[10px] uppercase text-slate-500 block mb-1">Docente:</b> {activeForm.docente}</div></div>
                                <table className="w-full border-collapse border border-black text-xs mt-6">
                                    <tr><td className="p-4 w-1/4 border border-black text-center bg-slate-50"><span className="text-[9px] block font-bold uppercase mb-1">Ausências a compensar</span><span className="text-2xl font-black">{Math.ceil(activeForm.absences - (activeForm.totalCHP * 0.25))} aulas</span></td><td className="p-2 w-1/4 border border-black text-center font-bold uppercase align-middle">DE ACORDO</td><td className="p-2 w-1/4 border border-black"></td><td className="p-2 w-1/4 border border-black"></td></tr>
                                    <tr className="text-center text-[9px] text-slate-400 font-bold uppercase"><td className="border border-black font-black bg-slate-100 text-slate-800">REGISTRO</td><td className="border border-black">Aluno ou Resp.</td><td className="border border-black">Docente</td><td className="border border-black">Orientador P.P.</td></tr>
                                </table>
                                <table className="w-full border-collapse border border-black text-[10px] mt-6 text-center">
                                    <tr className="bg-slate-50 font-bold border-b border-black uppercase tracking-widest"><th colSpan="3" className="border-r border-black py-2">PLANEJADO</th><th colSpan="3" className="py-2">EXECUTADO</th></tr>
                                    <tr className="font-bold border-b border-black text-[9px]"><td>Data</td><td>Horário</td><td>Nº Aulas*</td><td>Visto Aluno</td><td>Visto Monitor</td><td>Titular</td></tr>
                                    {[1,2,3,4,5,6].map(i => <tr key={i} className="h-10 border-b border-black last:border-0"><td>{i === 1 ? '___/___/___' : ''}</td><td></td><td></td><td></td><td></td><td></td></tr>)}
                                </table>
                                <div className="text-[8px] italic font-bold mt-2 text-slate-500">* Máximo 4 aulas por turno</div>
                                <div className="mt-8 border border-black min-h-[4cm] rounded-sm"><div className="bg-slate-50 border-b border-black text-[10px] font-black uppercase p-2 px-4">Atividades Diversas de Compensação</div></div>
                                <div className="mt-4 border border-black min-h-[1.5cm] rounded-sm"><div className="bg-slate-50 border-b border-black text-[10px] font-black uppercase p-1.5 px-4">Observações:</div></div>
                                <div className="absolute bottom-10 left-12 text-[12px] font-black">Jaú, ____/____/202__</div><div className="absolute bottom-10 right-12 text-[12px] font-black text-slate-300 tracking-widest">7.90-FR-44 v.0</div>
                            </div>
                        </div>
                    )}

                    {showRankingReport && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-sm z-[75] flex items-start justify-center p-4 py-10 overflow-y-auto print-overlay">
                            <div id="ranking-report-content" className="bg-white w-full max-w-[820px] shadow-2xl relative printable-report rounded-[2rem] overflow-hidden">
                                <div className="absolute top-6 right-6 flex gap-2 no-print z-10">
                                    <button onClick={downloadReportImage} title="Baixar como imagem PNG — ideal para enviar no WhatsApp" className="bg-emerald-600 text-white p-3 rounded-xl hover:bg-emerald-700 shadow-lg flex items-center gap-2 font-bold text-xs uppercase"><Icons.Download /> Baixar Imagem</button>
                                    <button onClick={() => window.print()} title="Imprimir ou salvar como PDF" className="bg-indigo-600 text-white p-3 rounded-xl hover:bg-indigo-700 shadow-lg flex items-center gap-2 font-bold text-xs uppercase"><Icons.Printer /> Imprimir / PDF</button>
                                    <button onClick={() => setShowRankingReport(false)} title="Fechar e voltar ao painel" className="bg-slate-100 px-4 py-3 rounded-xl hover:bg-slate-200 text-slate-500 flex items-center gap-2 font-black text-xs uppercase"><Icons.X /> Voltar</button>
                                </div>

                                <div className="bg-gradient-to-br from-indigo-600 to-purple-700 p-10 text-center">
                                    {!logoFailed && <img src={LOGO_DATA_URI} onError={() => setLogoFailed(true)} className="h-10 mx-auto mb-4 bg-white/95 rounded-lg p-1.5" />}
                                    <h1 className="text-2xl font-black uppercase tracking-wide text-white">🏆 Ranking de Frequência</h1>
                                    <p className="text-indigo-100 font-bold text-sm mt-1">{selectedTurma === 'Todas' ? 'Todas as Turmas' : selectedTurma} • {new Date().toLocaleDateString('pt-BR')}</p>
                                </div>

                                <div className="p-8 space-y-10">
                                    <div>
                                        <h2 className="text-lg font-black text-emerald-700 mb-4">🏅 Frequência Exemplar — Zero Faltas</h2>
                                        {rankingReportData.perfect.length === 0 ? (
                                            <p className="text-sm text-slate-400 font-bold">Nenhum aluno com zero faltas em todas as disciplinas nesta seleção.</p>
                                        ) : (
                                            // Todos aqui estão empatados em zero faltas — não faz sentido dar ouro pro
                                            // primeiro e prata/bronze pros seguintes, então todos recebem a mesma
                                            // medalha de ouro. Lista única em ordem alfabética (já vem assim de
                                            // rankingReportData.perfect), não mais em grade de 2 colunas.
                                            <div className="space-y-2">
                                                {rankingReportData.perfect.map((st) => (
                                                    <div key={st.id} className="flex items-center gap-3 bg-emerald-50 border border-emerald-200 rounded-2xl p-4">
                                                        <span className="text-2xl">🥇</span>
                                                        <div><div className="font-black text-slate-800 text-sm">{st.name}</div><div className="text-[10px] font-bold text-slate-400 uppercase">RA: {st.id} • {st.className}</div></div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <div>
                                        <h2 className="text-lg font-black text-blue-700 mb-4">📢 Ação Preventiva — Atenção Necessária</h2>
                                        {rankingReportData.preventive.length === 0 ? (
                                            <p className="text-sm text-slate-400 font-bold">Nenhum aluno em ação preventiva nesta seleção. 🎉</p>
                                        ) : (
                                            <div className="space-y-6">
                                                {rankingReportData.preventive.map(st => (
                                                    <div key={st.id} className="bg-blue-50/60 border border-blue-200 rounded-2xl p-5">
                                                        <div className="font-black text-slate-800 mb-1">{st.name}</div>
                                                        <div className="text-[10px] font-bold text-slate-400 uppercase mb-4">RA: {st.id} • {st.className}</div>
                                                        <div className="space-y-5">
                                                            {st.rows.map((r, idx) => (
                                                                <div key={idx}>
                                                                    <div className="text-[11px] font-black text-indigo-600 uppercase mb-2">{r.discipline}</div>
                                                                    <div className="space-y-3">
                                                                        <ImpactBar label={`Limite Total (${r.totalCHP}h)`} value={r.percentage} threshold={25} thresholdLabel="máx. 25%" />
                                                                        <ImpactBar label={`Comprometimento Atual (${r.horasDadas}h dadas)`} value={r.realPercentage} threshold={30} thresholdLabel="alerta 30%" />
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="bg-slate-50 border-t border-slate-100 p-4 text-center text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                                    CT 7.90 - Centro de Treinamento SENAI "Edward Sávio" • Gestão de Frequência
                                </div>
                            </div>
                        </div>
                    )}

                    {isManageModalOpen && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-[80] flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-2xl rounded-[3rem] p-10 space-y-8 shadow-2xl max-h-[90vh] overflow-y-auto scrollbar-hide">
                                <div className="flex justify-between items-center"><h2 className="text-2xl font-black text-slate-800">Gerenciar Dados</h2><button onClick={() => setIsManageModalOpen(false)} className="p-2 hover:bg-slate-100 rounded-full text-slate-400"><Icons.X /></button></div>

                                <div className="space-y-3">
                                    <h3 className="text-sm font-black text-slate-600 uppercase tracking-widest">Relatórios Importados ({Object.keys(dataStore).length})</h3>
                                    {Object.keys(dataStore).length === 0 && <p className="text-xs text-slate-400 font-bold">Nenhum relatório importado ainda.</p>}
                                    <div className="space-y-2 max-h-[30vh] overflow-y-auto pr-2 scrollbar-hide">
                                        {Object.entries(dataStore).map(([key, entry]) => (
                                            <div key={key} className={`p-4 rounded-2xl border-2 ${entry.warnings && entry.warnings.length > 0 ? 'bg-amber-50 border-amber-200' : 'bg-slate-50 border-transparent'}`}>
                                                <div className="flex justify-between items-start gap-3">
                                                    <div>
                                                        <p className="font-black text-slate-800 text-sm">{entry.disciplineName} — {entry.className}</p>
                                                        <p className="text-[10px] font-bold text-slate-400 uppercase mt-0.5">{entry.fileName} • {entry.students.length} aluno(s) • CHP: {entry.chp ?? 'não identificado'} • Aulas dadas: {entry.horasDadas ?? 'não identificado'}</p>
                                                        {entry.warnings && entry.warnings.length > 0 && (
                                                            <ul className="list-disc list-inside text-amber-700 text-[10px] mt-2 space-y-0.5">
                                                                {entry.warnings.map((w, i) => <li key={i}>{w}</li>)}
                                                            </ul>
                                                        )}
                                                    </div>
                                                    <button onClick={() => removeEntry(key)} title="Remover este relatório" className="shrink-0 p-2 rounded-xl bg-white border border-slate-200 text-red-500 hover:bg-red-50"><Icons.Trash /></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    {Object.keys(dataStore).length > 0 && (
                                        <button onClick={clearAllData} className="w-full bg-red-50 text-red-600 py-3 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-red-100">Limpar todos os dados importados</button>
                                    )}
                                </div>

                                <div className="space-y-3 border-t border-slate-100 pt-8">
                                    <h3 className="text-sm font-black text-slate-600 uppercase tracking-widest">Grupo de Monitoramento</h3>
                                    <p className="text-[10px] text-slate-400 font-bold -mt-2">Clique para incluir/ignorar um aluno nos cálculos e listas.</p>
                                    <div className="max-h-[40vh] overflow-y-auto space-y-3 pr-2 scrollbar-hide">
                                        {Object.values(dataStore).flatMap(e => e.students).filter((v, i, a) => a.findIndex(t => t.id === v.id) === i).map(s => (
                                            <div key={s.id} onClick={() => { const n = new Set(ignoredIds); n.has(s.id) ? n.delete(s.id) : n.add(s.id); setIgnoredIds(n); }} className={`p-5 rounded-2xl cursor-pointer flex justify-between items-center border-2 transition-all ${!ignoredIds.has(s.id) ? 'bg-indigo-50 border-indigo-200' : 'bg-slate-50 border-transparent opacity-40 grayscale'}`}>
                                                <div><div className="font-bold text-slate-800">{s.name}</div><div className="text-[10px] font-bold text-slate-400 uppercase">RA: {s.id}</div></div>
                                                {!ignoredIds.has(s.id) && <div className="text-indigo-600"><Icons.Check /></div>}
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <button onClick={() => setIsManageModalOpen(false)} className="w-full bg-slate-900 text-white py-5 rounded-2xl font-black uppercase tracking-[0.4em] shadow-xl active:scale-95 transition-all">Fechar</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
